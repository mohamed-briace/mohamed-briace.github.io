<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mohamed-briace</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --panel-2: #1b2438;
        --text: #e5edf9;
        --muted: #a8b4c8;
        --accent: #7dd3fc;
        --accent-2: #a78bfa;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827 35%, #0f172a);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(760px, 100%);
        background: rgba(18, 26, 43, 0.9);
        border: 1px solid rgba(125, 211, 252, 0.25);
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        padding: 40px 32px;
        backdrop-filter: blur(12px);
      }

      .eyebrow {
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.05;
      }

      .accent {
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
        margin: 18px 0 0;
        max-width: 56ch;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      a.button {
        text-decoration: none;
        color: var(--text);
        background: linear-gradient(135deg, rgba(125, 211, 252, 0.18), rgba(167, 139, 250, 0.22));
        border: 1px solid rgba(125, 211, 252, 0.4);
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      a.button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(125, 211, 252, 0.2);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">GitHub Pages</div>
      <h1>Bonjour, je suis <span class="accent">mohamed-briace</span></h1>
      <p>
        Bienvenue sur mon site personnel. Ce dépôt est prêt pour publier une page simple, un portefolio,
        ou un projet personnel à travers GitHub Pages.
      </p>
      <div class="links">
        <a class="button" href="https://github.com/mohamed-briace" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </main>
  </body>
</html>
